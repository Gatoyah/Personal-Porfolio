<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gideon Atoyah — Biomedical Engineer</title>
  <meta name="description" content="Gideon Atoyah — Biomedical Engineering graduate (First Class, KNUST). Research in medical imaging, deep learning for healthcare, bioinstrumentation and embedded medical devices. Seeking PhD and research-based graduate study.">
  <meta name="author" content="Gideon Atoyah">
  <meta name="theme-color" content="#060b16">
  <meta property="og:title" content="Gideon Atoyah — Biomedical Engineer">
  <meta property="og:description" content="Medical imaging · ML for healthcare · Bioinstrumentation. First Class BSc Biomedical Engineering, KNUST.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/gideonnn.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23060b16'/%3E%3Cpath d='M4 17h6l2.5-7 5 13 2.5-6H28' fill='none' stroke='%235eead4' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="os.css">
</head>
<body>

  <!-- ============ BOOT ============ -->
  <div id="boot" aria-hidden="true">
    <div class="boot-inner">
      <svg class="boot-ecg" viewBox="0 0 400 80" preserveAspectRatio="none">
        <path d="M0 40 H120 L135 40 L145 18 L158 66 L170 6 L182 58 L192 40 H260 L270 32 L280 40 H400"/>
      </svg>
      <div class="boot-name">Gideon<span>OS</span></div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-hint">Calibrating sensors · loading research…</div>
    </div>
  </div>

  <!-- ============ DESKTOP (≥ 761px) ============ -->
  <div id="desktop" class="wallpaper">
    <div class="wp-grid"></div>
    <div class="wp-blob b1"></div><div class="wp-blob b2"></div><div class="wp-blob b3"></div>
    <svg class="wp-ecg" viewBox="0 0 1600 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 100 H300 L320 100 L335 60 L355 150 L372 20 L390 130 L402 100 H700 L715 88 L730 100 H1000 L1020 100 L1035 60 L1055 150 L1072 20 L1090 130 L1102 100 H1400 L1415 88 L1430 100 H1600"/>
    </svg>

    <header class="menubar">
      <div class="mb-left">
        <button class="mb-logo" data-open="about" aria-label="About Gideon">
          <svg viewBox="0 0 24 24"><path d="M2 12h5l2-5 4 10 2-5h7"/></svg>
        </button>
        <strong class="mb-app" id="mbApp">Desktop</strong>
        <nav class="mb-menu">
          <button data-open="research">Research</button>
          <button data-open="courses">Courses</button>
          <button data-open="experience">Experience</button>
          <button data-open="cv">CV</button>
          <button data-open="mail">Contact</button>
        </nav>
      </div>
      <div class="mb-right">
        <span class="mb-status"><i></i>Open to PhD positions</span>
        <button class="mb-icon" id="mbSearch" aria-label="Search (Ctrl+K)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="mb-icon" id="mbTheme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <span class="mb-clock" id="mbClock"></span>
      </div>
    </header>

    <div class="desk-icons" id="deskIcons"></div>

    <section class="hero" aria-label="Introduction">
      <p class="hero-kicker">Biomedical Engineer · Kumasi, Ghana</p>
      <h1 class="hero-name">Gideon<br><em>Atoyah</em></h1>
      <p class="hero-sub">I build things that see inside the body — synthetic X-rays, segmentation models, and sensor-based medical devices.</p>
      <div class="hero-cta">
        <button class="btn primary" data-open="research">Explore research</button>
        <button class="btn ghost" data-open="cv">Read CV</button>
        <span class="kbd-hint">or press <kbd>Ctrl</kbd> <kbd>K</kbd></span>
      </div>
    </section>

    <aside class="widgets" id="widgets"></aside>

    <div id="windows"></div>

    <nav class="dock" id="dock" aria-label="Dock"></nav>
  </div>

  <!-- ============ PHONE (≤ 760px) ============ -->
  <div id="phone" class="wallpaper">
    <div class="wp-blob b1"></div><div class="wp-blob b2"></div><div class="wp-blob b3"></div>
    <div class="statusbar">
      <span class="sb-time" id="sbTime"></span>
      <span class="sb-island"></span>
      <span class="sb-icons">
        <svg viewBox="0 0 24 24"><path d="M2 20h2v-3H2zM7 20h2v-6H7zM12 20h2v-9h-2zM17 20h2V7h-2z" class="fill"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" class="fill"/></svg>
        <span class="sb-batt"><i></i></span>
      </span>
    </div>
    <main class="home" id="home">
      <button class="ph-search" id="phSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search Gideon’s research</button>
      <div class="ph-widgets" id="phWidgets"></div>
      <div class="ph-grid" id="phGrid"></div>
      <div class="ph-dots"><i class="on"></i><i></i></div>
    </main>
    <nav class="ph-dock" id="phDock"></nav>
    <div id="sheets"></div>
    <button class="home-ind" id="homeInd" aria-label="Go home"><i></i></button>
  </div>

  <!-- ============ SPOTLIGHT ============ -->
  <div id="spotlight" hidden>
    <div class="sp-panel" role="dialog" aria-label="Search">
      <div class="sp-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="spInput" type="text" placeholder="Search research, courses, skills…" autocomplete="off" spellcheck="false">
        <kbd>esc</kbd>
      </div>
      <ul class="sp-results" id="spResults"></ul>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <noscript>
    <div style="padding:40px;font-family:sans-serif;color:#fff;background:#060b16;position:fixed;inset:0;z-index:9999">
      <h1>Gideon Atoyah</h1>
      <p>Biomedical Engineering graduate (First Class Honours, KNUST). Research in medical imaging, deep learning for healthcare, bioinstrumentation and embedded medical devices.</p>
      <p><a style="color:#5eead4" href="assets/resume/Gideon_Atoyah_CV.pdf">Download CV</a> · <a style="color:#5eead4" href="mailto:gideonatoyah@gmail.com">gideonatoyah@gmail.com</a></p>
    </div>
  </noscript>

  <script src="os.js"></script>
</body>
</html>
